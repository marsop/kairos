<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Kairos - Time Tracker</title>
    <meta name="description" content="Track your time with real-time activities. Bank hours or spend them with the tap of a button." />
    <base href="/" />
    <script>
        (function () {
            try {
                var rawSettings = localStorage.getItem("Kairos_settings");
                var parsed = rawSettings ? JSON.parse(rawSettings) : null;
                var theme = parsed && parsed.Theme === "dark" ? "dark" : "light";
                document.documentElement.setAttribute("data-theme", theme);
            } catch (e) {
                document.documentElement.setAttribute("data-theme", "light");
            }
        })();
    </script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Styles -->
    <link rel="stylesheet" href="_content/Kairos.App/css/app.css" />
    <link rel="icon" type="image/svg+xml" href="appicon.svg" />
    <link href="Kairos.Web.styles.css" rel="stylesheet" />
    <link rel="manifest" href="manifest.json" />
</head>

<body>
    <div id="app">
        <div style="display: flex; align-items: center; justify-content: center; height: 100vh; background: #f5f6f3; color: #6c7f7b;">
            <div style="text-align: center;">
                <div style="font-size: 2rem; margin-bottom: 1rem;">⏱️</div>
                <div id="loading-text">Loading Kairos...</div>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui" style="display: none; position: fixed; bottom: 0; left: 0; right: 0; padding: 1rem; background: #b42318; color: white; text-align: center;">
        <span id="error-text">An unhandled error has occurred.</span>
        <a href="." id="reload-text" class="reload" style="color: white; margin-left: 1rem;">Reload</a>
        <span class="dismiss" style="cursor: pointer; margin-left: 1rem;">🗙</span>
    </div>

    <script>
        (function () {
            try {
                var lang = 'en';
                var rawSettings = localStorage.getItem("Kairos_settings");
                if (rawSettings) {
                    var parsed = JSON.parse(rawSettings);
                    if (parsed && parsed.Language) {
                        lang = parsed.Language;
                    }
                } else if (navigator.language) {
                    lang = navigator.language.split('-')[0];
                }

                var translations = {
                    'es': {
                        title: 'Kairos - Gestor de tiempo',
                        loading: 'Cargando Kairos...',
                        error: 'Ha ocurrido un error no controlado.',
                        reload: 'Recargar'
                    },
                    'gl': {
                        title: 'Kairos - Xestor de tempo',
                        loading: 'Cargando Kairos...',
                        error: 'Produciuse un erro non controlado.',
                        reload: 'Recargar'
                    },
                    'de': {
                        title: 'Kairos - Zeiterfassung',
                        loading: 'Lade Kairos...',
                        error: 'Ein unbehandelter Fehler ist aufgetreten.',
                        reload: 'Neu laden'
                    },
                    'gsw': {
                        title: 'Kairos - Ziiterfassig',
                        loading: 'Lade Kairos...',
                        error: 'Es isch en unbehandlete Fähler ufträtte.',
                        reload: 'Neu lade'
                    }
                };

                var t = translations[lang];
                if (t) {
                    document.title = t.title;
                    var loadingNode = document.getElementById('loading-text');
                    if (loadingNode) loadingNode.innerText = t.loading;
                    var errorNode = document.getElementById('error-text');
                    if (errorNode) errorNode.innerText = t.error;
                    var reloadNode = document.getElementById('reload-text');
                    if (reloadNode) reloadNode.innerText = t.reload;
                }
            } catch (e) {
                // Ignore errors during translation injection
            }
        })();
    </script>
    <script src="_content/Kairos.App/timeularInterop.js"></script>
    <script src="js/notificationInterop.js"></script>
    <script src="js/fileInterop.js"></script>
    <script src="js/pwaInterop.js"></script>
    <script src="js/supabaseRealtimeInterop.js"></script>
    <script src="js/themeInterop.js"></script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/emoji-picker-element@1/index.js"></script>
    <script src="js/emojiPickerInterop.js"></script>
    <script src="js/navigationInterop.js"></script>
    <script src="js/activitiesKeyboardInterop.js"></script>
    <script src="js/soundInterop.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>navigator.serviceWorker.register('service-worker.js');</script>
</body>

</html>
